[project]
name = "microbiome_analysis"
version = "0.1.0"
description = "Reproduction and extension of Fouladi et al. 2020's cross-cohort bariatric-surgery gut-microbiome signature (Fodor Lab)"
requires-python = ">=3.9"
dependencies = []

# No runtime dependencies: every Python entry point in this repo is a stdlib-only
# heredoc embedded in scripts/*.sbatch or scripts/*.sh (see requirements.txt). The
# actual analysis is R, run inside the paper authors' own Singularity images
# (images/*.sif, pulled by scripts/00_setup.sh) — not managed by this file.

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
